{% with r=rating|floatformat:"0"|add:"0" %}
<span class="stars" role="img" aria-label="{{ r }} out of 5 stars">
  {% for i in "12345" %}{% if forloop.counter <= r %}<i class="bi bi-star-fill" aria-hidden="true"></i>{% else %}<i class="bi bi-star" aria-hidden="true"></i>{% endif %}{% endfor %}
</span>
{% endwith %}
