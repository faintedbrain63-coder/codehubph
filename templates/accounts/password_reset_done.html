{% extends "base.html" %}
{% block title %}Check your email · {% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card auth-card text-center">
    <div class="icon-tile icon-tile-lg mx-auto mb-3" aria-hidden="true"><i class="bi bi-envelope-check"></i></div>
    <h1 class="h3 mb-2">Check your email</h1>
    <p class="text-body-secondary mb-4">If an account exists for that address, a password reset link is on its way. The link works once and expires in 3 days.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to sign in</a>
  </div>
</div>
{% endblock %}
