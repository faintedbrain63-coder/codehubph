{% extends "accounts/security_base.html" %}
{% block title %}Password updated · {% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card auth-card text-center">
    <div class="icon-tile icon-tile-lg mx-auto mb-3" aria-hidden="true"><i class="bi bi-check2-circle"></i></div>
    <h1 class="h3 mb-2">Your password has been updated</h1>
    <p class="text-body-secondary mb-4">You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign in</a>
  </div>
</div>
{% endblock %}
