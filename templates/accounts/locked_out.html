{% extends "base.html" %}
{% block title %}Too many attempts · {% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card auth-card text-center">
    <div class="icon-tile icon-tile-lg mx-auto mb-3" aria-hidden="true"><i class="bi bi-shield-exclamation"></i></div>
    <h1 class="h3 mb-2">Too many sign-in attempts</h1>
    <p class="text-body-secondary mb-4">For your security, sign-in is paused for 30 minutes. If you forgot your password, you can reset it now.</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a href="{% url 'accounts:password_reset' %}" class="btn btn-primary">Reset my password</a>
      <a href="{% url 'accounts:login' %}" class="btn btn-soft">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
