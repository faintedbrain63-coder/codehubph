<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · CodehubPh</title>
  <style>
    :root { color-scheme: dark; font-size: 18px; }
    body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #e2e8f0; background: radial-gradient(120% 120% at 50% 0%, #111c3a 0%, #060a18 60%); display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
    main { box-sizing: border-box; text-align: center; width: 100%; padding: 2.5rem; border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 1.5rem; background: rgba(15, 23, 42, 0.72); box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.9); }
    .mark { display: inline-grid; place-items: center; width: 3rem; height: 3rem; margin-bottom: 1rem; border-radius: 0.9rem; background: linear-gradient(135deg, #6366f1, #22d3ee); color: #fff; font-size: 1.3rem; font-weight: 700; }
    h1 { font-size: 1.55rem; margin: 0 0 0.6rem; letter-spacing: -0.02em; }
    p { color: #a9b8cf; line-height: 1.65; margin: 0 0 1.25rem; }
    a { display: inline-block; padding: 0.7rem 1.1rem; border-radius: 0.65rem; background: #6366f1; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">!</div>
    <h1>Something went wrong on our side</h1>
    <p>We have been notified and are looking into it. Your orders and payments are safe. Please try again in a few minutes.</p>
    <p><a href="/">Back to the home page</a></p>
  </main>
</body>
</html>
